<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Purrfect Jumping - High Scores</title>

    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        table {
            border-collapse: collapse;
            width: 400px;
            margin: 30px auto;
        }

        th {
            border-bottom: 2px solid #ffffff;
            padding: 10px;
        }

        td {
            border-bottom: 1px solid #444444;
            padding: 10px;
        }
    </style>
</head>

<body>

<h1>PURRFECT JUMPING</h1>
<h2>HIGH SCORES</h2>

<table>
    <tr>
        <th>RANK</th>
        <th>PLAYER</th>
        <th>SCORE</th>
    </tr>

    <tbody id="scores">
        <tr>
            <td colspan="3">Loading scores...</td>
        </tr>
    </tbody>
</table>

<script>

var request = new XMLHttpRequest();

request.open(
    "GET",
    "https://purrfec-jumping-score.nathanmatthews1212.workers.dev/",
    true
);

request.onreadystatechange = function() {

    if (request.readyState == 4) {

        if (request.status == 200) {

            var data = JSON.parse(request.responseText);
            var scores = data.dreamlo.leaderboard.entry;

            var html = "";

            for (var i = 0; i < scores.length; i++) {

                html += "<tr>";
                html += "<td>" + (i + 1) + "</td>";
                html += "<td>" + scores[i].name + "</td>";
                html += "<td>" + scores[i].score + "</td>";
                html += "</tr>";

            }

            document.getElementById("scores").innerHTML = html;

        } else {

            document.getElementById("scores").innerHTML =
                "<tr><td colspan='3'>Unable to load scores</td></tr>";

        }
    }
};

request.send();

</script>

</body>
</html>
